<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이디어 제목 · 아이디어 제작소</title>
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script><style>
:root{
  --bg:#fbf9f4; --ink:#14141a; --ink-2:#5f636b; --card:#ffffff; --line:#e9e4d8; --line2:#d6d0c2;
  --yellow:#fdba2d; --accent-text:#a86a00; --glass:rgba(20,20,26,.05); --glass-line:rgba(20,20,26,.08);
  --shadow:0 14px 34px rgba(60,44,10,.10);
  --sans:"Noto Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a0a0b; --ink:#f4f4f5; --ink-2:#a1a4ab; --card:#141416; --line:#26272b; --line2:#34363b;
  --accent-text:#fdba2d; --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.08); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.top{padding:14px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:10px 4px}
.back img{width:34px;height:34px;border-radius:50%}
.theme{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:19px;line-height:1}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
h1{font-size:clamp(28px,6vw,42px);margin:28px 0 8px;letter-spacing:-.045em;font-weight:600;line-height:1.2}
.sub{color:var(--ink-2)}
.panel{margin:26px 0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}

</style>
</head>
<body>
<div class="top"><div class="wrap"><a class="back" href="../../"><img src="../../assets/favicon.png" alt="">아이디어 제작소</a><button class="theme" id="themeBtn" type="button" aria-label="화면 모드 바꾸기"><span class="moon">🌙</span><span class="sun">☀️</span></button></div></div>
<div class="wrap">
  <h1>아이디어 제목</h1>
  <p class="sub">한 줄 소개</p>
  <div class="panel">여기에 기획 요약 또는 시안 내용을 넣습니다.</div>
</div>
<script>(function(){var b=document.getElementById('themeBtn');if(!b)return;b.onclick=function(){var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}};})();</script>
</body>
</html>
