<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지? 메뉴 룰렛 · 아이디어 제작소</title>
<link rel="icon" href="../../assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script><style>
:root{
  --bg:#fbf9f4; --ink:#14141a; --ink-2:#5f636b; --card:#ffffff; --line:#e9e4d8; --line2:#d6d0c2;
  --yellow:#fdba2d; --accent-text:#a86a00; --glass:rgba(20,20,26,.05); --glass-line:rgba(20,20,26,.08);
  --shadow:0 14px 34px rgba(60,44,10,.10);
  --sans:"Noto Sans KR","Pretendard","Malgun Gothic",system-ui,sans-serif; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0a0a0b; --ink:#f4f4f5; --ink-2:#a1a4ab; --card:#141416; --line:#26272b; --line2:#34363b;
  --accent-text:#fdba2d; --glass:rgba(255,255,255,.07); --glass-line:rgba(255,255,255,.08); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden;background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
.top{padding:14px 0}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{display:inline-flex;align-items:center;gap:8px;font-weight:700;padding:10px 4px}
.back img{width:34px;height:34px;border-radius:50%}
.theme{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);cursor:pointer;display:grid;place-items:center;font-size:19px;line-height:1}
.theme .sun{display:none}
:root[data-theme="dark"] .theme .sun{display:block}
:root[data-theme="dark"] .theme .moon{display:none}
h1{font-size:clamp(28px,6vw,42px);margin:28px 0 8px;letter-spacing:-.045em;font-weight:600;line-height:1.2}
.sub{color:var(--ink-2)}
.panel{margin:26px 0;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:var(--shadow)}
.result{min-height:100px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(30px,9vw,48px);font-weight:800;letter-spacing:-.04em;word-break:keep-all}
button{font:inherit;cursor:pointer;border:1px solid var(--line2);border-radius:14px;padding:12px 20px;font-weight:700;background:var(--card);color:var(--ink)}
button.main{background:var(--yellow);border-color:var(--yellow);color:#111;width:100%;font-size:19px;padding:16px;margin-top:12px}
button:active{transform:translateY(2px)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{border:1px solid var(--line2);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer;user-select:none;min-height:38px;display:inline-flex;align-items:center}
.chip.off{opacity:.38;text-decoration:line-through}
.add{display:flex;gap:8px;margin-top:16px}
.add input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:1px solid var(--line2);border-radius:14px;background:var(--bg);color:var(--ink)}
.note{font-size:13px;color:var(--ink-2);margin:0 0 56px}
</style>
</head>
<body>
<div class="top"><div class="wrap"><a class="back" href="../../index.html"><img src="../../assets/favicon.png" alt="">아이디어 제작소</a><button class="theme" id="themeBtn" type="button" aria-label="화면 모드 바꾸기"><span class="moon">🌙</span><span class="sun">☀️</span></button></div></div>
<div class="wrap">
  <h1>오늘 뭐 먹지?</h1>
  <p class="sub">고민될 때 눌러 보세요. 칩을 누르면 제외, 입력창으로 메뉴를 추가할 수 있어요.</p>

  <div class="panel">
    <div class="result" id="result">버튼을 눌러 보세요</div>
    <button class="main" id="spin">메뉴 뽑기</button>
    <div class="chips" id="chips"></div>
    <div class="add"><input id="newItem" placeholder="메뉴 추가 (예: 쌀국수)" maxlength="12"><button id="addBtn">추가</button></div>
  </div>
  <p class="note">샘플 페이지입니다. 입력한 메뉴는 이 기기 브라우저에만 저장되며 서버로 전송되지 않습니다.</p>
</div>

<script>
(function(){
  var KEY='menu-roulette-v1';
  var base=['김치찌개','된장찌개','제육볶음','비빔밥','돈까스','파스타','짜장면','국밥','샐러드','햄버거','초밥','치킨','칼국수','떡볶이'];
  var items;
  try{ items=JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if(!Array.isArray(items)) items=base.map(function(n){return {n:n,on:true};});
  function save(){ try{localStorage.setItem(KEY,JSON.stringify(items));}catch(e){} }
  var chips=document.getElementById('chips'), result=document.getElementById('result');
  function render(){
    chips.innerHTML='';
    items.forEach(function(it,i){
      var s=document.createElement('span'); s.className='chip'+(it.on?'':' off'); s.textContent=it.n;
      s.onclick=function(){ it.on=!it.on; save(); render(); };
      chips.appendChild(s);
    });
  }
  document.getElementById('spin').onclick=function(){
    var pool=items.filter(function(i){return i.on;});
    if(!pool.length){ result.textContent='메뉴를 하나 이상 켜 주세요'; return; }
    var n=0, t=setInterval(function(){
      result.textContent=pool[Math.floor(Math.random()*pool.length)].n;
      if(++n>12){ clearInterval(t); }
    },70);
  };
  document.getElementById('addBtn').onclick=function(){
    var v=document.getElementById('newItem'), name=v.value.trim();
    if(!name) return;
    items.push({n:name,on:true}); v.value=''; save(); render();
  };
  render();
})();
</script>
<script>(function(){var b=document.getElementById('themeBtn');if(!b)return;b.onclick=function(){var r=document.documentElement,n=r.getAttribute('data-theme')==='dark'?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('theme',n);}catch(e){}};})();</script>
</body>
</html>
